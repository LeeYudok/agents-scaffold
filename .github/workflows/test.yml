name: tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # apt 대신 npm 의 bats-core 공식 배포를 버전 고정으로 받는다 — 러너 apt 미러 DNS 장애에 job 이 떨어지지 않게 (#111).
      # 전역 설치(-g)는 man 페이지 경로(/usr/local/share/man) 쓰기 권한이 없어 EACCES 로 실패하므로 임시 prefix 에 둔다.
      - name: Install bats-core
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/bats" bats@1.13.0
          echo "$RUNNER_TEMP/bats/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/bats/node_modules/.bin/bats" --version

      # writer 검사기는 Go 표준 라이브러리만 쓴다 (#117, Rust 판 #115 대체). Python 호환 테스트도 같은 실행 파일을 쓴다.
      # go.mod 의 최소 버전(1.22)으로 돌려 하위 호환을 확인한다.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Build and check Go writing checker
        working-directory: .claude/skills/yd-writer-kr/go
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          go build -trimpath -o "$RUNNER_TEMP/check-writing" .
          echo "CHECK_WRITING_BIN=$RUNNER_TEMP/check-writing" >> "$GITHUB_ENV"

      - name: Run python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      # 스킬별 테스트(#78) — 각 스킬 폴더의 tests/test_*.py. DB·Go·React·브라우저가 필요한 단언은 여기선 skip 되고
      # skills-*.yml 의 경로 필터 워크플로가 그 도구를 깔고 skip 없이 돌린다.
      - name: Run skill tests
        run: scripts/dev/run-skill-tests.sh

      - name: Run install-skills.sh tests
        run: bash tests/test_install_skills.sh

      - name: Run agents-scaffold.sh bats tests
        run: bats tests/agents-scaffold.bats

      # 지원 매트릭스 게이트 (#37) — tier=full 인데 실측이 만료됐거나, 판정에 근거가
      # 없거나, manifest 와 문서의 CLI 버전이 어긋나면 실패한다. 문서를 자동 수정하지
      # 않는다 — 강등은 사람이 PR 로 반영한다.
      - name: Check harness support matrix
        run: python3 scripts/dev/check-harness-matrix.py

  # 스킬 플러그인 마켓플레이스(#82) — 사본 드리프트는 unittest(test_build_plugins)가, 매니페스트 형식은 Claude Code 검증기가 본다.
  # 검증기는 인증 없이 로컬에서 돈다. 버전은 고정한다(검증 규칙이 바뀌면 PR 로 올린다).
  plugins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check plugin copies against sources
        run: python3 scripts/dev/build-plugins.py --check
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.318
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done

  # 동봉한 dotfiles/ (#76) — 원본 LeeYudok/dotfiles 의 check.yml 과 같은 검사.
  # 하위 디렉터리의 .github/workflows 는 GitHub 가 실행하지 않으므로 여기서 돌린다.
  dotfiles:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotfiles
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 식별자 검사
        run: scripts/check-identifiers.sh
      # python3·jq 는 러너에 이미 있다. zsh 는 apt 대신 러너에 깔린 Homebrew 로 받는다 — bottle 이 ghcr.io 에 있어
      # apt 미러(azure.archive·archive.ubuntu.com) DNS 장애와 무관하다 (#111)
      - name: 문법 검사 도구 설치
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
        run: |
          command -v python3 jq
          if ! command -v zsh >/dev/null; then
            brew=/home/linuxbrew/.linuxbrew/bin/brew
            "$brew" install zsh
            mkdir -p "$RUNNER_TEMP/bin"
            ln -sf "$("$brew" --prefix)/bin/zsh" "$RUNNER_TEMP/bin/zsh"
            echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          fi
          "$(command -v zsh || echo "$RUNNER_TEMP/bin/zsh")" --version
      - name: 파일별 문법 검사
        run: scripts/check-syntax.sh
      # dotfiles 원본이 이 레포로 옮겨와(#76) 이 job 이 유일한 게이트다 — 밀폐형 시험(임시 HOME·모의 패키지 관리자)도 돌린다.
      # test-windows-paths.sh 는 실제 apt·curl 설치를 해서 제외한다(네트워크·sudo 의존).
      - name: 밀폐형 시험
        run: |
          for t in test-agy-statusline test-codex-cost-hook test-codex-status-line test-install-safety test-windows-git test-yolo-wrapper; do
            echo "== $t"; bash "scripts/$t.sh"
          done
