name: tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  # 정적 검사 (#107). 여기서 걸리는 것은 실행 전에 잡히는 종류다 — 쓰지 않는 import, 셸 인용 실수, 워크플로 문법.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # dotfiles/ 는 자체 문법 검사(dotfiles job)가 있고 plugins/ 는 생성물이라 뺀다.
      # 스택 파셜과 bats 는 shebang 이 없어 -s bash 로 따로 본다.
      - name: shellcheck (warning)
        run: |
          shellcheck --version
          git ls-files -z -- '*.sh' ':!dotfiles/**' ':!plugins/**' ':!bin/agents-scaffold.sh' ':!**/pre-commit.partial.sh' \
            | xargs -0 shellcheck -S warning
          shellcheck -S warning -s bash presets/stacks/*/.claude/hooks/pre-commit.partial.sh tests/stack-gates.bats

      # 설치기는 아직 warning 1건(SC2115)이 남아 error 수준으로만 본다. 고치면 위 목록으로 옮긴다.
      # tests/agents-scaffold.bats 는 SC2314(`! cmd` 가 실패로 이어지지 않음)가 남아 아직 대상이 아니다.
      - name: shellcheck (error) — installer
        run: shellcheck -S error bin/agents-scaffold.sh

      # F(pyflakes)·E9(문법 오류)만 본다 — 스타일이 아니라 실제 결함을 잡는 규칙이다. 버전은 고정한다.
      - name: ruff
        run: |
          pipx install ruff==0.16.9
          ruff check --select F,E9 .

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # GNU parallel 이 있어야 bats --jobs 가 돈다.
      - name: Install bats-core and GNU parallel
        run: sudo apt-get update -y && sudo apt-get install -y bats parallel

      - name: Run python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      # 스킬별 테스트(#78) — 각 스킬 폴더의 tests/test_*.py. DB·Go·React·브라우저가 필요한 단언은 여기선 skip 되고
      # skills-*.yml 의 경로 필터 워크플로가 그 도구를 깔고 skip 없이 돌린다.
      - name: Run skill tests
        run: scripts/dev/run-skill-tests.sh

      - name: Run install-skills.sh tests
        run: bash tests/test_install_skills.sh

      - name: Run install smoke test
        run: bash tests/smoke-install.sh

      # 테스트마다 격리된 BATS_TEST_TMPDIR 을 쓰므로 파일·테스트 단위로 병렬 실행한다 (#107).
      - name: Run bats tests
        run: bats --jobs "$(nproc)" tests/*.bats

      # 지원 매트릭스 게이트 (#37) — 판정에 근거가 없거나, manifest 와 문서의 CLI 버전이 어긋나면
      # 실패한다. 만료(tier=full 실측이 한도를 넘김)는 여기서 경고만 한다 — 날짜가 지났다는 이유로
      # 무관한 PR 이 막히지 않게 하고, 만료 실패는 주간 harness-matrix.yml 이 낸다 (#107).
      - name: Check harness support matrix
        run: python3 scripts/dev/check-harness-matrix.py --no-expiry --warn-days 14

  # macOS 시스템 bash 3.2 (#107). 설치기와 훅은 3.2 에서 돌아야 한다 — ubuntu 의 bash 5 로는
  # 빈 배열 참조·연관 배열 같은 3.2 비호환이 드러나지 않는다.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # `#!/usr/bin/env bash` 가 Homebrew bash 5 가 아니라 /bin/bash 3.2 를 잡도록 PATH 맨 앞에 둔다.
      - name: Put system bash 3.2 first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/sysbash"
          ln -s /bin/bash "$RUNNER_TEMP/sysbash/bash"
          echo "$RUNNER_TEMP/sysbash" >> "$GITHUB_PATH"

      - name: Verify bash is 3.2
        run: |
          bash --version | head -1
          bash -c '[ "${BASH_VERSINFO[0]}" -eq 3 ]'

      - name: Install smoke test
        run: bash tests/smoke-install.sh

      - name: Install bats-core
        run: brew install bats-core

      # 스택 게이트는 가짜 툴과 격리된 PATH 로 돌아 툴체인이 필요 없다 — 파셜의 3.2 호환을 여기서 본다.
      - name: Stack gate tests
        run: bats tests/stack-gates.bats

  # Windows Git Bash (#107). 심링크를 만들 수 없는 환경이라 사본 레이아웃(AGENTS_SCAFFOLD_NO_SYMLINK=1)으로 깔고,
  # 실제 git commit 이 훅을 타는지 본다. bats 는 깔지 않는다.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      AGENTS_SCAFFOLD_NO_SYMLINK: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show environment
        run: |
          bash --version | head -1
          git --version
          uname -s

      - name: Install smoke test (install + git commit gate)
        run: bash tests/smoke-install.sh

  # 스킬 플러그인 마켓플레이스(#82) — 사본 드리프트는 unittest(test_build_plugins)가, 매니페스트 형식은 Claude Code 검증기가 본다.
  # 검증기는 인증 없이 로컬에서 돈다. 버전은 고정한다(검증 규칙이 바뀌면 PR 로 올린다).
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check plugin copies against sources
        run: python3 scripts/dev/build-plugins.py --check
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.318
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          for p in plugins/*/; do claude plugin validate "$p"; done

  # 동봉한 dotfiles/ (#76) — 원본 LeeYudok/dotfiles 의 check.yml 과 같은 검사.
  # 하위 디렉터리의 .github/workflows 는 GitHub 가 실행하지 않으므로 여기서 돌린다.
  dotfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: dotfiles
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: 식별자 검사
        run: scripts/check-identifiers.sh
      - name: 문법 검사 도구 설치
        run: sudo apt-get update -qq && sudo apt-get install -y zsh python3
      - name: 파일별 문법 검사
        run: scripts/check-syntax.sh
      # dotfiles 원본이 이 레포로 옮겨와(#76) 이 job 이 유일한 게이트다 — 밀폐형 시험(임시 HOME·모의 패키지 관리자)도 돌린다.
      # test-windows-paths.sh 는 실제 apt·curl 설치를 해서 제외한다(네트워크·sudo 의존).
      - name: 시험 도구 설치
        run: sudo apt-get install -y jq
      - name: 밀폐형 시험
        run: |
          for t in test-agy-statusline test-codex-cost-hook test-codex-status-line test-install-safety test-windows-git; do
            echo "== $t"; bash "scripts/$t.sh"
          done
