name: tests

on:
  push:
    branches: ["main", "develop"]
  pull_request:

permissions:
  contents: read

jobs:
  # yd-writer-kr 검사기를 윈도우에서 bash 없이 실행 파일만으로 돌린다 (#137).
  # 빌드 뒤의 단계는 go 를 부르지 않는다. 릴리스에 올리는 바이너리와 같은 스크립트로 만든다.
  writer-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      CHECK_WRITING_RULES: ${{ github.workspace }}\.claude\skills\yd-writer-kr\references\banned-expressions.md
      CHECK_WRITING_BIN: ${{ github.workspace }}\out\check-writing-windows-amd64.exe
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Build the windows binary
        shell: bash
        run: skills/yd-skills/skills/yd-writer-kr/scripts/build-binaries.sh out windows/amd64

      - name: Run from PowerShell 7
        shell: pwsh
        run: |
          [Console]::OutputEncoding = [Text.Encoding]::UTF8
          Set-Content -Path ok.md -Value "본문이다." -Encoding utf8
          Set-Content -Path bad.md -Value "배포를 완료함. 여러 파일들을 지웠다." -Encoding utf8
          & $env:CHECK_WRITING_BIN ok.md
          if ($LASTEXITCODE -ne 0) { throw "ok.md: exit $LASTEXITCODE" }
          $report = & $env:CHECK_WRITING_BIN --json bad.md | ConvertFrom-Json
          if ($LASTEXITCODE -ne 1) { throw "bad.md: exit $LASTEXITCODE" }
          if ($report.errors -ne 1 -or $report.warnings -ne 1) { throw "bad.md: $($report | ConvertTo-Json -Depth 5)" }
          & $env:CHECK_WRITING_BIN --profile none ok.md
          if ($LASTEXITCODE -ne 2) { throw "없는 프로필: exit $LASTEXITCODE" }
          exit 0

      # BOM 이 붙은 글은 메모장으로 저장한 글과 같은 모양이다.
      # Windows PowerShell 5 는 BOM 없는 스크립트를 ANSI 로 읽어 한글 리터럴이 깨진다. 그래서 글("배포를 완료함.")을 코드 포인트로 만든다.
      - name: Run on a file with BOM (Windows PowerShell 5)
        shell: powershell
        run: |
          $text = -join [char[]](0xBC30,0xD3EC,0xB97C,0x0020,0xC644,0xB8CC,0xD568,0x002E)
          [IO.File]::WriteAllText("$PWD\\bom.md", $text, (New-Object Text.UTF8Encoding $true))
          & $env:CHECK_WRITING_BIN bom.md
          if ($LASTEXITCODE -ne 1) { throw "bom.md: exit $LASTEXITCODE" }
          exit 0

      - name: Run from cmd
        shell: cmd
        run: |
          chcp 65001
          "%CHECK_WRITING_BIN%" ok.md
          if errorlevel 1 exit /b 1
          "%CHECK_WRITING_BIN%" bad.md
          if not errorlevel 1 exit /b 1
          if errorlevel 2 exit /b 1
          exit /b 0

      # Python 호환 계층은 CHECK_WRITING_BIN 이 있으면 bash 를 거치지 않는다.
      - name: Run the Python layer with the binary
        shell: pwsh
        run: |
          python .claude\skills\yd-writer-kr\scripts\check_writing.py bad.md
          if ($LASTEXITCODE -ne 1) { throw "check_writing.py: exit $LASTEXITCODE" }
          python .github\scripts\writer_windows_check.py
          if ($LASTEXITCODE -ne 0) { throw "writer_windows_check.py: exit $LASTEXITCODE" }
          exit 0

  # 정적 검사 (#107). 여기서 걸리는 것은 실행 전에 잡히는 종류다 — 쓰지 않는 import, 셸 인용 실수, 워크플로 문법.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # 스택 파셜과 bats 는 shebang 이 없어 -s bash 로 따로 본다.
      - name: shellcheck (warning)
        run: |
          shellcheck --version
          git ls-files -z -- '*.sh' ':!**/pre-commit.partial.sh' \
            | xargs -0 shellcheck -S warning
          shellcheck -S warning -s bash presets/stacks/*/.claude/hooks/pre-commit.partial.sh tests/*.bats
          shellcheck -S warning skills/yd-skills/skills/yd-writer-kr/scripts/check-writing

      # F(pyflakes)·E9(문법 오류)만 본다 — 스타일이 아니라 실제 결함을 잡는 규칙이다. 버전은 고정한다.
      - name: ruff
        run: |
          pipx install ruff==0.16.9
          ruff check --select F,E9 .

      - name: actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint" -color

  bats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install bats-core and GNU parallel
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_ENV_HINTS: '1'
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/bats" bats@1.13.0
          echo "$RUNNER_TEMP/bats/node_modules/.bin" >> "$GITHUB_PATH"
          if ! command -v parallel >/dev/null; then
            /home/linuxbrew/.linuxbrew/bin/brew install parallel
            echo /home/linuxbrew/.linuxbrew/bin >> "$GITHUB_PATH"
          fi

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false
      - name: Build and check Go writing checker
        working-directory: skills/yd-skills/skills/yd-writer-kr/go
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
          go build -trimpath -o "$RUNNER_TEMP/check-writing" .
          echo "CHECK_WRITING_BIN=$RUNNER_TEMP/check-writing" >> "$GITHUB_ENV"

      - name: Run python unit tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      # 스킬별 테스트(#78) — 각 스킬 폴더의 tests/test_*.py. DB·Go·React·브라우저가 필요한 단언은 여기선 skip 되고
      # skills-*.yml 의 경로 필터 워크플로가 그 도구를 깔고 skip 없이 돌린다.
      - name: Run skill tests
        run: scripts/dev/run-skill-tests.sh

      - name: Run install-skills.sh tests
        run: bash tests/test_install_skills.sh

      - name: Run install smoke test
        run: bash tests/smoke-install.sh

      # 테스트마다 격리된 BATS_TEST_TMPDIR 을 쓰므로 파일·테스트 단위로 병렬 실행한다 (#107).
      - name: Run bats tests
        run: bats --jobs "$(nproc)" tests/*.bats

      # 지원 매트릭스 게이트 (#37) — 판정에 근거가 없거나, manifest 와 문서의 CLI 버전이 어긋나면
      # 실패한다. 만료(tier=full 실측이 한도를 넘김)는 여기서 경고만 한다 — 날짜가 지났다는 이유로
      # 무관한 PR 이 막히지 않게 하고, 만료 실패는 주간 harness-matrix.yml 이 낸다 (#107).
      - name: Check harness support matrix
        run: python3 scripts/dev/check-harness-matrix.py --no-expiry --warn-days 14

      # README 4개 언어·랜딩·llms.txt 의 스택 수·스킬 수·하네스 등급·버전이 실제와 같은지(#107)
      - name: Check numbers stated in the docs
        run: python3 scripts/dev/check-doc-numbers.py

  # macOS 시스템 bash 3.2 (#107). 설치기와 훅은 3.2 에서 돌아야 한다 — ubuntu 의 bash 5 로는
  # 빈 배열 참조·연관 배열 같은 3.2 비호환이 드러나지 않는다.
  macos:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # `#!/usr/bin/env bash` 가 Homebrew bash 5 가 아니라 /bin/bash 3.2 를 잡도록 PATH 맨 앞에 둔다.
      - name: Put system bash 3.2 first on PATH
        run: |
          mkdir -p "$RUNNER_TEMP/sysbash"
          ln -s /bin/bash "$RUNNER_TEMP/sysbash/bash"
          echo "$RUNNER_TEMP/sysbash" >> "$GITHUB_PATH"

      - name: Verify bash is 3.2
        run: |
          bash --version | head -1
          bash -c '[ "${BASH_VERSINFO[0]}" -eq 3 ]'

      - name: Install smoke test
        run: bash tests/smoke-install.sh

      - name: Install bats-core
        run: brew install bats-core

      # 스택 게이트는 가짜 툴과 격리된 PATH 로 돌아 툴체인이 필요 없다 — 파셜의 3.2 호환을 여기서 본다.
      - name: Stack gate tests
        run: bats tests/stack-gates.bats

  # Windows Git Bash (#107). 심링크를 만들 수 없는 환경이라 사본 레이아웃(AGENTS_SCAFFOLD_NO_SYMLINK=1)으로 깔고,
  # 실제 git commit 이 훅을 타는지 본다. bats 는 깔지 않는다.
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      AGENTS_SCAFFOLD_NO_SYMLINK: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show environment
        run: |
          bash --version | head -1
          git --version
          uname -s

      - name: Install smoke test (install + git commit gate)
        run: bash tests/smoke-install.sh

  # 스킬 플러그인 마켓플레이스(#82) — 사본 드리프트는 unittest(test_build_plugins)가, 매니페스트 형식은 Claude Code 검증기가 본다.
  # 검증기는 인증 없이 로컬에서 돈다. 버전은 고정한다(검증 규칙이 바뀌면 PR 로 올린다).
  plugins:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check plugin copies against sources
        run: python3 scripts/dev/build-plugins.py --check
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.318
      - name: Validate marketplace and plugins
        run: |
          claude plugin validate .
          for p in skills/yd-skills skills/yd-skills-personal; do claude plugin validate "$p"; done
