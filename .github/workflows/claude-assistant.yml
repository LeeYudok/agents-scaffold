name: Claude Assistant

# 이슈·PR 코멘트에서 @claude 멘션 시 응답한다.
# issue_comment / pull_request_review_comment 는 base 브랜치 컨텍스트로 실행되므로
# fork PR 에서도 시크릿에 접근 가능 — 그래서 아래 author_association 가드로
# 쓰기 권한 보유자(OWNER/MEMBER/COLLABORATOR)의 멘션만 트리거한다.
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  claude-response:
    # vars.CLAUDE_REVIEW_ENABLED 미설정 레포(시크릿 없음)에서는 실행하지 않는다
    if: |
      vars.CLAUDE_REVIEW_ENABLED == 'true' &&
      contains(github.event.comment.body, '@claude') &&
      (github.event.comment.author_association == 'OWNER' ||
       github.event.comment.author_association == 'MEMBER' ||
       github.event.comment.author_association == 'COLLABORATOR')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@4fa93a88de49bbef68b10eb15aabedf28ca0e1ed # v1.0.271
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --max-turns 10
            --model claude-sonnet-5
